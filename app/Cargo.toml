[package]
name = "leitor-jw"
version = "0.7.0"
description = "Leitor de publicações .jwpub no estilo do JW Library, para Linux"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "leitor_jw_lib"
# Só "rlib" no PC (o disco é pequeno); para Android: ["staticlib", "cdylib", "rlib"].
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
leitor-nucleo = { path = "../nucleo" }
leitor-baixar = { path = "../baixar" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
flate2 = "1"
