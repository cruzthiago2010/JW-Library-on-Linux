# Gera os instaladores (.deb e AppImage) para x86_64 e ARM64 quando uma tag vX.Y.Z é enviada,
# e anexa os arquivos à release dessa tag (cria a release se ainda não existir).
name: Versão
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pacotes:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arq: x86_64
            deb: amd64
          - runner: ubuntu-22.04-arm
            arq: aarch64
            deb: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev pkg-config patchelf file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2
      - name: Testes do núcleo
        run: cargo test -p leitor-nucleo
      - name: Compilar
        working-directory: app
        run: cargo tauri build --bundles deb,appimage
      - name: Juntar os arquivos
        id: arquivos
        run: |
          V=$(grep -m1 '"version"' app/tauri.conf.json | sed -E 's/.*"([0-9.]+)".*/\1/')
          mkdir saida
          cp target/release/bundle/deb/*.deb "saida/leitor-jw_${V}_${{ matrix.deb }}.deb"
          cp target/release/bundle/appimage/*.AppImage "saida/JW_Library_on_Linux-${V}-${{ matrix.arq }}.AppImage"
          ls -la saida
      - uses: actions/upload-artifact@v4
        with:
          name: pacotes-${{ matrix.arq }}
          path: saida/*
      - name: Anexar à release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "JW Library on Linux ${GITHUB_REF_NAME#v}" --notes-file NOTAS-DA-VERSAO.md
          gh release upload "$GITHUB_REF_NAME" saida/* --clobber
