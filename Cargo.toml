# Leitor no estilo JW Library para Linux: o núcleo (sem Tauri, testável) e a casca Tauri.
[workspace]
members = ["nucleo", "baixar", "app"]
resolver = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1

# O disco do PC de desenvolvimento é pequeno: sem informação de depuração nos
# nossos pacotes (as dependências continuam como estão, sem recompilar).
[profile.dev.package.leitor-jw]
debug = 0
[profile.dev.package.leitor-nucleo]
debug = 0
[profile.dev.package.leitor-baixar]
debug = 0
