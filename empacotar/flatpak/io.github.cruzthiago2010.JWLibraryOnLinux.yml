# Flatpak do JW Library on Linux. Compilar e instalar só para o usuário:
#   flatpak-builder --user --install --force-clean compilacao empacotar/flatpak/io.github.cruzthiago2010.JWLibraryOnLinux.yml
# Gerar o arquivo .flatpak para a página de versões:
#   flatpak build-bundle ~/.local/share/flatpak/repo JW_Library_on_Linux.flatpak io.github.cruzthiago2010.JWLibraryOnLinux
id: io.github.cruzthiago2010.JWLibraryOnLinux
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: leitor-jw
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # A mesma pasta de dados do AppImage e do baixador (publicações, grifos e notas).
  - --filesystem=xdg-data/io.github.leitorjw:create
  # Para o aviso de arquivos .jwpub novos em Downloads.
  - --filesystem=xdg-download:ro
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: leitor-jw
    buildsystem: simple
    build-options:
      # Baixa as dependências do Rust durante a compilação (para o Flathub, trocar por
      # fontes geradas com flatpak-cargo-generator).
      build-args:
        - --share=network
      env:
        CARGO_HOME: /run/build/leitor-jw/cargo
    build-commands:
      - cargo build --release --locked -p leitor-jw --features tauri/custom-protocol
      - install -Dm755 target/release/leitor-jw /app/bin/leitor-jw
      - install -Dm644 empacotar/flatpak/io.github.cruzthiago2010.JWLibraryOnLinux.desktop /app/share/applications/io.github.cruzthiago2010.JWLibraryOnLinux.desktop
      - install -Dm644 empacotar/flatpak/io.github.cruzthiago2010.JWLibraryOnLinux.metainfo.xml /app/share/metainfo/io.github.cruzthiago2010.JWLibraryOnLinux.metainfo.xml
      - install -Dm644 app/icons/icone.svg /app/share/icons/hicolor/scalable/apps/io.github.cruzthiago2010.JWLibraryOnLinux.svg
      - install -Dm644 app/icons/128x128.png /app/share/icons/hicolor/128x128/apps/io.github.cruzthiago2010.JWLibraryOnLinux.png
      - install -Dm644 app/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/io.github.cruzthiago2010.JWLibraryOnLinux.png
    sources:
      - type: dir
        path: ../..
        skip:
          - dist
          - data
          - baixador
          - target
          - compilacao
          - .flatpak-builder
          - docs/interno
