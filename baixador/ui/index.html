<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baixador para JW Library on Linux</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header id="titulo">
  <img src="icone.svg" alt="" width="18" height="18">
  <span>Baixador para JW Library on Linux</span>
</header>
<div id="comandos">
  <nav class="abas" id="abas">
    <button data-aba="catalogo" class="ativa">CATÁLOGO</button>
    <button data-aba="selecao">MINHA SELEÇÃO</button>
    <button data-aba="baixados">BAIXADOS</button>
  </nav>
  <label id="idioma-caixa">Idioma
    <select id="idioma"></select>
  </label>
</div>
<main id="conteudo"></main>
<div id="aviso"></div>
<script src="app.js"></script>
</body>
</html>
